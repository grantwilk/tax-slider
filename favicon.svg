<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three bands and a marker: the same idea the page is built on. The fill
       follows the browser theme so the mark reads on a light or a dark tab. -->
  <style>
    .bg { fill: #F0EFEA }
    .bar { fill: #2E4A7D }
    .mark { fill: #1A1B20 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15161A }
      .bar { fill: #7BA5EC }
      .mark { fill: #FFFFFF }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <rect class="bar" x="5"  y="8"  width="13" height="4" rx="1.4"/>
  <rect class="bar" x="5"  y="14" width="21" height="4" rx="1.4"/>
  <rect class="bar" x="5"  y="20" width="9"  height="4" rx="1.4"/>
  <rect class="mark" x="17" y="5"  width="2"  height="22" rx="1"/>
</svg>
